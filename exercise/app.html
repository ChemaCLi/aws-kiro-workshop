<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Focus Garden</title>
  <meta name="description" content="Focus Garden: tareas con pomodoro que hacen crecer un jardín 3D." />
  <meta name="theme-color" content="#fbf6ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Focus Garden" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />

  <!-- Tailwind por CDN: sin Node, sin build. Los colores viven en src/ui/tailwind-config.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./src/ui/tailwind-config.js"></script>

  <!-- Tone.js por CDN: genera la música lofi de fondo. Si no carga, la app sigue igual. -->
  <script src="https://unpkg.com/tone@14.8.49/build/Tone.js" defer></script>

  <!-- Three.js por CDN con import map; se importa de forma dinámica en src/three/ -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/app.css" />
</head>
<body>
  <!-- La app es una SPA: las pestañas cambian con el hash (#/tasks, #/focus...). La landing es index.html. -->
  <app-shell></app-shell>
  <noscript>Esta app necesita JavaScript.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
