<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jardín de Tareas · Workshop Kiro</title>

  <!-- Tailwind por CDN (sin build, sin Node) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            work: '#6366f1',
            personal: '#ec4899',
            health: '#22c55e',
            social: '#f59e0b',
            fun: '#06b6d4',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          keyframes: {
            'fade-in': {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'pop': {
              '0%': { transform: 'scale(0.8)', opacity: '0' },
              '60%': { transform: 'scale(1.05)' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
          },
          animation: {
            'fade-in': 'fade-in 0.3s ease-out',
            'pop': 'pop 0.25s ease-out',
          },
        },
      },
    };
  </script>

  <!-- Three.js + import map para los módulos de addons -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,0.15), transparent 60%),
        radial-gradient(1000px 500px at 110% 10%, rgba(34,197,94,0.12), transparent 55%),
        #0b1020;
    }
    /* Scrollbar sutil */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,0.4); }
  </style>
</head>
<body class="min-h-screen text-slate-100 font-sans antialiased">
  <!-- Encabezado -->
  <header class="max-w-7xl mx-auto px-4 pt-8 pb-4">
    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
      <div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">
          🌱 Jardín de Tareas
        </h1>
        <p class="text-slate-400 mt-1">
          Cada ronda de pomodoro hace crecer tu bosque. Workshop Kiro.
        </p>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <span id="stat-rounds" class="px-3 py-1.5 rounded-full bg-slate-800/70 border border-slate-700">🍅 0 rondas</span>
        <span id="stat-done" class="px-3 py-1.5 rounded-full bg-slate-800/70 border border-slate-700">✅ 0 tareas</span>
      </div>
    </div>
  </header>

  <!-- Layout principal -->
  <main class="max-w-7xl mx-auto px-4 pb-16 grid grid-cols-1 lg:grid-cols-[1fr_minmax(420px,1.1fr)] gap-6">
    <!-- Columna izquierda: tareas + tendencias -->
    <section class="space-y-6">
      <task-list></task-list>
      <trends-chart></trends-chart>
    </section>

    <!-- Columna derecha: pomodoro + jardín -->
    <section class="space-y-6">
      <pomodoro-timer></pomodoro-timer>
      <garden-scene></garden-scene>
    </section>
  </main>

  <footer class="max-w-7xl mx-auto px-4 pb-10 text-center text-xs text-slate-500">
    Hecho con Web Components · Tailwind · Three.js — sin Node, sin build. Datos en tu navegador (localStorage).
  </footer>

  <!-- App (módulos ES nativos) -->
  <script type="module" src="./js/store.js"></script>
  <script type="module" src="./js/components/task-list.js"></script>
  <script type="module" src="./js/components/pomodoro-timer.js"></script>
  <script type="module" src="./js/components/trends-chart.js"></script>
  <script type="module" src="./js/components/garden-scene.js"></script>
</body>
</html>
